include-file = ~/.config/polybar/colors.ini

[bar/main]
width = 98.5%
height = 34
offset-x = 12
offset-y = 10

background = ${colors.background}
foreground = ${colors.foreground}
line-size = 0

border-size = 0
padding-left = 3
padding-right = 3
module-margin = 1

font-0 = "Hack Nerd Font:size=10;4"
font-1 = "Hack Nerd Font:size=15;3"
font-2 = "Hack Nerd Font Mono:size=23;3"
font-3 = "JetBrains Mono:size=10;3"

modules-left = kali network terminal
modules-center = bspwm 
modules-right = date 

cursor-click = pointer



[module/bspwm]
type = internal/bspwm
pin-workspaces = true

label-focused = ▰
label-focused-font = 3
label-focused-foreground = ${colors.alert}
label-focused-padding = 0

label-occupied = ▰
label-occupied-font = 3
label-occupied-foreground = ${colors.blue-neon}
label-occupied-padding = 0

label-empty = ▱
label-empty-font = 3
label-empty-foreground = ${colors.gray}
label-empty-padding = 0

label-urgent = ▰
label-urgent-font = 3
label-urgent-foreground = ${colors.white}
label-urgent-padding = 0

[module/date]
type = internal/date
interval = 1
date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S
label = %date%
label-foreground = ${colors.white}
label-font = 4


[module/network]
type = internal/network
interface = eth0
interval = 3.0

format-connected = <label-connected>
label-connected = %{T2}%{F#4A9FE0}󰈁%{F-}%{T-} %{T4}%{F#c1c0c0}%local_ip%%{F-}%{T-}

format-disconnected = <label-disconnected>
label-disconnected = %{T2}%{F#FD0103}󰈂%{F-}%{T-}

[module/terminal]
type = custom/text
label = " "  
click-left = kitty &
label-foreground = ${colors.disabled}
label-font = 2

[module/kali]
type = custom/text
label = " "
label-foreground = ${colors.alert}
label-font = 2
